{% extends "base.html" %}
{% block title %}Password reset &mdash; Peakform{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="container auth-page__inner">
    <div class="card card--elevated auth-card">
      <h1 class="auth-card__title">Password updated</h1>
      <p class="auth-card__subtitle">Your password has been changed. You can sign in with it now.</p>
      <a class="btn btn--primary btn--block btn--lg" href="{% url 'accounts:login' %}">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}
