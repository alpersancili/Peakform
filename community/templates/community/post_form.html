{% extends "base.html" %}
{% block title %}Edit post &mdash; Peakform{% endblock %}

{% block content %}
<section class="section">
  <div class="container form-page">
    <div class="section__heading" style="margin-bottom: var(--space-6); text-align: left;">
      <h1>Edit post</h1>
    </div>

    <form class="card form-card" method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      <div class="form-grid">
        {% for field in form %}
          <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
          </div>
        {% endfor %}
      </div>
      <button class="btn btn--primary btn--lg" type="submit">Save changes</button>
    </form>
  </div>
</section>
{% endblock %}
