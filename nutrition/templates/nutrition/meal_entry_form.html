{% extends "base.html" %}
{% block title %}Edit entry &mdash; Peakform{% endblock %}

{% block content %}
<section class="section">
  <div class="container form-page">
    <div class="section__heading" style="margin-bottom: var(--space-6); text-align: left;">
      <h1>Edit {{ entry.food.name }}</h1>
    </div>

    <form class="card form-card" method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn--primary" type="submit">Save</button>
      <a class="btn btn--ghost" href="{% url 'nutrition:dashboard' %}">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
